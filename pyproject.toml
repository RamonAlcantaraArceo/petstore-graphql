[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petstore-graphql"
version = "0.1.0"
description = "Minimal production-ready FastAPI GraphQL service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.4.0",
  "strawberry-graphql[fastapi]>=0.270.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
